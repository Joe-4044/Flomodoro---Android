  function toggleClip(i) {
    if (_selectedClipIndices.has(i)) _selectedClipIndices.delete(i); else _selectedClipIndices.add(i);
    renderWheelPane();
  }

  function computeWheelCeiling(holding) {
    holding = holding || [];
    const sel = [..._selectedClipIndices].map(i => holding[i]).filter(Boolean);
    if (!sel.length) return 1;
    if (sel.some(c => c.isGold)) return 3;
    const counts = {}; sel.forEach(c => { counts[c.id]=(counts[c.id]||0)+1; });
    const max = Math.max(...Object.values(counts));
    if (max >= 3) return 3; if (max >= 2) return 2; return 1;
  }

  function onSpin() {
    if (wheelSpinning || _selectedClipIndices.size === 0 || !_wheelGoalId) return;
    const goals   = S.goals();
    const g       = goals.find(go => String(go.id) === String(_wheelGoalId));
    const wState  = S.wheel(_wheelGoalId);
    const holding = wState.holding || [];

    const ceiling = computeWheelCeiling(holding);
    const allowed = WHEEL_SEGMENTS.filter(s => {
      if (s.id==='t2'&&ceiling<2) return false;
      if (s.id==='t3'&&ceiling<3) return false;
      if (s.id==='jackpot'&&ceiling<3) return false;
      return true;
    });
    const total = allowed.reduce((a,s)=>a+s.pct,0);
    let r = Math.random()*total; let outcome = allowed[0];
    for (const s of allowed) { if (r<s.pct){outcome=s;break;} r-=s.pct; }

    const matching  = MAIN_WHEEL_SLICES.map((id,i)=>id===outcome.id?i:-1).filter(i=>i>=0);
    const sliceIdx  = matching[Math.floor(Math.random()*matching.length)];
    const centerDeg = sliceIdx*10+5;
    const curMod    = ((wheelRotation%360)+360)%360;
    let toAdd       = (360-centerDeg-curMod+360)%360;
    if (toAdd<10) toAdd+=360;
    wheelRotation  += (5+Math.floor(Math.random()*3))*360 + toAdd;
    wheelSpinning   = true;

    // record spin and consume selected clips
    wState.spins = wState.spins || [];
    wState.spins.unshift({ ts: Date.now(), outcome: outcome.id, ceiling });
    if (wState.spins.length > 50) wState.spins = wState.spins.slice(0, 50);
    const selArr = [..._selectedClipIndices].sort((a,b)=>b-a);
    selArr.forEach(i => { wState.holding.splice(i, 1); });
    _selectedClipIndices = new Set();
    S.saveWheel(_wheelGoalId, wState);

    const disc = document.getElementById('wheel-disc');
    if (disc) {
      disc.style.transition = 'transform 4.2s cubic-bezier(0.17,0.67,0.12,0.99)';
      disc.style.transform  = `rotate(${wheelRotation}deg)`;
    }
    renderWheelPane();

    setTimeout(() => {
      wheelSpinning = false;

      // jar: $1 per spin
      S.addToJar(1, `spin · ${g ? g.name : 'goal'}`);

      // ticket generation for tier outcomes
      let ticket = null;
      const tierNum = { t1:1, t2:2, t3:3, jackpot:3 }[outcome.id];
      if (tierNum) {
        const rewardApp  = (g && g['reward'+tierNum+'App'])  || null;
        const rewardDur  = (g && g['reward'+tierNum+'Dur'])  || 30;
        const rewardType = (g && g['reward'+tierNum+'Type']) || 'ticket';
        if (rewardType === 'ticket' || !g || !g['reward'+tierNum+'Type']) {
          const code = Math.random().toString(36).slice(2,6).toUpperCase();
          ticket = {
            code,
            rewardApp:    rewardApp || '—',
            durationMins: rewardDur,
            goalName:     g ? g.name : '—',
            tier:         { t1:'T1', t2:'T2', t3:'T3', jackpot:'T3' }[outcome.id],
            device:       'mobile',
            status:       'active',
            earnedAt:     Date.now(),
            expiresAt:    Date.now() + 24*3600*1000,
          };
          const tickets = S.tickets();
          tickets.unshift(ticket);
          S.saveTickets(tickets);
        }
      }

      _fbPushFullState();
      renderWheelPane();
      showSpinResultModal(outcome, ticket, g);
    }, 4400);
  }

    // mark ticket as redeemed locally

      durationMins: t.durationMins || 30,
      show:         t.show         || null,
      device:       'mobile',
      redeemedAt:   Date.now(),

    const now = new Date();
    const dow = now.getDay();
    const mon = new Date(now); mon.setDate(now.getDate()-((dow+6)%7)); mon.setHours(0,0,0,0);
    const sun = new Date(mon); sun.setDate(mon.getDate()+6);
    const fmt = d => d.toLocaleDateString('en-CA',{month:'short',day:'numeric'});

    const _weeklyGoals = S.goals().filter(g => g.kind !== 'blocker').map(g => {
      const todayKey = S.today();
      const secs = Object.values(g.dailySecs || {}).reduce((a,v)=>a+v,0);
      return { name:g.name, color:g.color||'#6aad7e', secs, clips:0, sessions:0 };
    });
    pane.innerHTML = `
      <div class="weekly-header">${fmt(mon)} – ${fmt(sun)}</div>
      ${_weeklyGoals.map(g => `
        <div class="weekly-row">
          <div class="weekly-dot" style="background:${g.color};"></div>
          <span class="weekly-name">${g.name}</span>
          <div class="weekly-stats">
            <div>${fmtHrMin(g.secs)}</div>
            <div style="color:var(--text4);">${g.clips} clip${g.clips!==1?'s':''} · ${g.sessions} session${g.sessions!==1?'s':''}</div>
          </div>
        </div>`).join('')}
    `;
  }

  function fmtHrMin(secs) {
    const h = Math.floor(secs/3600);
    const m = Math.floor((secs%3600)/60);
    return h ? `${h}h ${m}m` : `${m}m`;
  }

  // ── TICKETS ───────────────────────────────────────────────────────────
  let _ticketFilter = 'all';

  function setTicketFilter(f) {
    _ticketFilter = f;
    renderTicketsPane();
  }

  function fmtTimeRemaining(ts) {
    const secs = Math.max(0, Math.floor((ts - Date.now()) / 1000));
    const h = Math.floor(secs/3600);
    const m = Math.floor((secs%3600)/60);
    return h ? `${h}h ${m}m` : `${m}m`;
  }

  function fmtTimeAgo(ts) {
    const secs = Math.floor((Date.now() - ts) / 1000);
    if (secs < 3600) return `${Math.floor(secs/60)}m ago`;
    if (secs < 86400) return `${Math.floor(secs/3600)}h ago`;
    return `${Math.floor(secs/86400)}d ago`;
  }

  function renderTicketsPane() {
    const pane = document.getElementById('tickets-pane-inner');
    if (!pane) return;

    const _tickets = S.tickets();
    const active   = _tickets.filter(t => t.status==='active');
    const redeemed = _tickets.filter(t => t.status==='redeemed');
    const expired  = _tickets.filter(t => t.status==='expired');

    let shown = _tickets;
    if (_ticketFilter==='active')  shown = active;
    if (_ticketFilter==='history') shown = [...redeemed,...expired];

    const shownActive  = shown.filter(t => t.status==='active');
    const shownHistory = shown.filter(t => t.status!=='active');

    pane.innerHTML = `
      <div class="tickets-summary">
        <div class="tickets-summary-cell">
          <div class="tickets-summary-count" style="color:var(--green);">${active.length}</div>
          <div class="tickets-summary-label">ACTIVE</div>
        </div>
        <div class="tickets-summary-cell">
          <div class="tickets-summary-count" style="color:var(--blue);">${redeemed.length}</div>
          <div class="tickets-summary-label">REDEEMED</div>
        </div>
        <div class="tickets-summary-cell">
          <div class="tickets-summary-count" style="color:var(--text3);">${expired.length}</div>
          <div class="tickets-summary-label">EXPIRED</div>
        </div>
      </div>

      <div class="tickets-filter">
        ${['all','active','history'].map(f => `
          <button class="ticket-filter-btn${_ticketFilter===f?' active':''}" onclick="setTicketFilter('${f}')">
            ${f==='all'?'All':f==='active'?'Active':'History'}
          </button>`).join('')}
      </div>

      ${shown.length === 0 ? '<div class="tickets-empty">no tickets yet — spin the wheel to earn your first reward</div>' : ''}

      ${shownActive.map(t => `
        <div class="ticket-card" style="border-left-color:var(--green);">
          <div class="ticket-card-top">
            <div>
              <div class="ticket-card-title">${t.rewardApp} · ${t.durationMins} min</div>
              <div class="ticket-card-sub">${t.goalName} · ${t.tier}</div>
            </div>
            <span class="ticket-device-badge" style="color:var(--green);background:rgba(106,173,126,0.12);border:0.5px solid rgba(106,173,126,0.3);">MOBILE</span>
          </div>
          <div class="ticket-code" onclick="copyCode('${t.code}')">${t.code}</div>
          <div class="ticket-code-hint">Expires in ${fmtTimeRemaining(t.expiresAt)} · tap to copy</div>
          <button class="ticket-redeem-btn" onclick="redeemTicket('${t.code}')">redeem on PC →</button>
        </div>`).join('')}

      ${shownHistory.length ? `
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-family:var(--mono);font-size:9px;color:var(--text4);letter-spacing:0.1em;">HISTORY</span>
          <div style="flex:1;height:0.5px;background:var(--border2);"></div>
        </div>
        ${shownHistory.map(t => {
          const isRedeemed = t.status==='redeemed';
          return `<div class="ticket-history-card">
            <div class="ticket-history-info">
              <div>
                <span class="ticket-history-title">${t.rewardApp} · ${t.durationMins} min</span>
                <span class="ticket-history-code">${t.code}</span>
              </div>
              <div class="ticket-history-sub">${t.goalName} · ${t.tier} · ${fmtTimeAgo(t.expiresAt)}</div>
            </div>
            <span class="ticket-status-pill" style="color:${isRedeemed?'var(--blue)':'var(--text4)'};background:${isRedeemed?'rgba(122,154,222,0.12)':'rgba(255,255,255,0.04)'};border:0.5px solid ${isRedeemed?'rgba(122,154,222,0.3)':'rgba(255,255,255,0.1)'};">
              ${isRedeemed?'REDEEMED':'EXPIRED'}
            </span>
          </div>`;
        }).join('')}` : ''}
    `;
  }

  function copyCode(code) {
    navigator.clipboard?.writeText(code);
  }

  // ── REWARDS JAR ──────────────────────────────────────────────────────
  // Jar reads from S

  function buildJarSVG(total, moonAmt, miniAmt, midAmt) {
    const fillPct  = Math.min(100, (total / moonAmt) * 100);
    const miniPct  = Math.min(99, (miniAmt / moonAmt) * 100);
    const midPct   = Math.min(99, (midAmt  / moonAmt) * 100);
    const W = 72, H = 100;
    const bodyTop = 18, bodyBot = 92, bodyL = 8, bodyR = 64;
    const fillY = bodyBot - ((bodyBot - bodyTop) * fillPct / 100);
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <!-- lid -->
      <rect x="14" y="4" width="44" height="10" rx="3" fill="#2a2a28" stroke="#3a3a38" stroke-width="0.5"/>
      <!-- body outline -->
      <rect x="${bodyL}" y="${bodyTop}" width="${bodyR-bodyL}" height="${bodyBot-bodyTop}" rx="6" fill="#1a1a18" stroke="#3a3a38" stroke-width="0.5"/>
      <!-- fill -->
      <clipPath id="jar-clip"><rect x="${bodyL+1}" y="${bodyTop+1}" width="${bodyR-bodyL-2}" height="${bodyBot-bodyTop-2}" rx="5"/></clipPath>
      <rect x="${bodyL+1}" y="${fillY}" width="${bodyR-bodyL-2}" height="${bodyBot-fillY}" fill="#4a8c5c" opacity="0.7" clip-path="url(#jar-clip)"/>
      <!-- prize lines -->
      <line x1="${bodyL}" y1="${bodyBot - (bodyBot-bodyTop)*miniPct/100}" x2="${bodyR}" y2="${bodyBot - (bodyBot-bodyTop)*miniPct/100}" stroke="#6aad7e" stroke-width="0.7" opacity="0.5" stroke-dasharray="3,2"/>
      <line x1="${bodyL}" y1="${bodyBot - (bodyBot-bodyTop)*midPct/100}"  x2="${bodyR}" y2="${bodyBot - (bodyBot-bodyTop)*midPct/100}"  stroke="#7a9ade" stroke-width="0.7" opacity="0.5" stroke-dasharray="3,2"/>
    </svg>`;
  }

  function renderJarPane() {
    const pane = document.getElementById('jar-pane-inner');
    if (!pane) return;
    const { total, moonAmt, midAmt, miniAmt, mini, mid, moon, ledger } = S.jar();
    const miniReached = total >= miniAmt;
    const midReached  = total >= midAmt;
    const moonReached = total >= moonAmt;

    pane.innerHTML = `
      <div class="jar-visual-row">
        <div class="jar-svg-wrap">${buildJarSVG(total, moonAmt, miniAmt, midAmt)}</div>
        <div class="jar-stats">
          <div class="jar-total-amt">$${total}</div>
          <div class="jar-total-label">reward jar · every goal feeds this</div>
        </div>
      </div>

      <div class="prize-lines">
        <div class="prize-row${miniReached?' reached':''}">
          <span class="prize-key">mini</span>
          <span class="prize-lbl">${mini || 'set a mini prize'}</span>
          <span class="prize-amt">${miniReached ? '✓' : '$'+miniAmt}</span>
        </div>
        <div class="prize-row${midReached?' reached':miniReached?' next':''}">
          <span class="prize-key">mid</span>
          <span class="prize-lbl">${mid || 'set a mid prize'}</span>
          <span class="prize-amt">${midReached ? '✓' : miniReached ? '$'+total+'/$'+midAmt : '$'+midAmt}</span>
        </div>
        <div class="prize-row${moonReached?' reached':''}">
          <span class="prize-key">moon</span>
          <span class="prize-lbl">${moon || 'set a moonshot'}</span>
          <span class="prize-amt">${moonReached ? '✓' : '$'+moonAmt}</span>
        </div>
      </div>

      <div class="ledger-section">
        <div class="ledger-header">recent deposits</div>
        ${ledger && ledger.length
          ? ledger.slice(0, 8).map(l => `
            <div class="ledger-row">
              <div class="ledger-dot"></div>
              <span>${l.source}</span>
              <span class="ledger-amt">+$${l.amount}</span>
            </div>`).join('')
          : '<div class="ledger-empty">no deposits yet</div>'
        }
      </div>
    `;
  }

  // ── FORMAT HELPERS ────────────────────────────────────────────────────
  function fmtHMS(secs) {
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    return (h ? String(h).padStart(2,'0') + ':' : '') +
           String(m).padStart(2,'0') + ':' +
           String(s).padStart(2,'0');
  }
  function fmtMS(secs) {
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }
</script>
</body>
</html>
