<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111110">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flomodoro">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>Flomodoro</title>

  <!-- Service worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE = 'flomodoro-v1';
        self.addEventListener('install', e => { self.skipWaiting(); });
        self.addEventListener('activate', e => { e.waitUntil(clients.claim()); });
        self.addEventListener('fetch', e => {
          if (e.request.mode === 'navigate') {
            e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
          }
        });
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(swBlob), { scope: './' }).catch(() => {});
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── RESET ─────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, select, textarea { font-family: inherit; }

    /* ── TOKENS ────────────────────────────────────────────────────────── */
    :root {
      --bg:           #111110;
      --bg2:          #0e0e0d;
      --bg3:          #161615;
      --bg4:          #1e1e1c;
      --border:       #3a3a38;
      --border2:      #2a2a28;
      --text:         #e8e8e6;
      --text2:        #aaaaaa;
      --text3:        #777777;
      --text4:        #555555;
      --green:        #6aad7e;
      --green-bg:     #1a2a1c;
      --green-border: #2a3a2d;
      --amber:        #cd8a3a;
      --amber-bg:     #2a1f15;
      --amber-border: #3a2a1a;
      --red:          #c46a6a;
      --blue:         #7a9ade;
      --purple:       #9a7ade;
      --gold:         #d9b44a;

      --mono: 'JetBrains Mono', monospace;
      --sans: 'Syne', sans-serif;

      /* safe area insets for notch/home bar devices */
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);

      --nav-h: 64px;
      --subnav-h: 44px;
      --header-h: 52px;
    }

    /* ── BASE ──────────────────────────────────────────────────────────── */
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    /* ── APP SHELL ─────────────────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      padding-top: var(--sat);
    }

    /* ── MAIN CONTENT AREA ─────────────────────────────────────────────── */
    #main {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* ── TAB PANELS ────────────────────────────────────────────────────── */
    .tab-panel {
      display: none;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    .tab-panel.active { display: flex; }

    /* ── BOTTOM NAV ────────────────────────────────────────────────────── */
    #bottom-nav {
      display: flex;
      height: calc(var(--nav-h) + var(--sab));
      padding-bottom: var(--sab);
      background: var(--bg2);
      border-top: 0.5px solid var(--border2);
      flex-shrink: 0;
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: var(--text4);
      transition: color 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .nav-btn.active { color: var(--green); }
    .nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .nav-btn span { font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }

    /* ── SCREEN HEADER ─────────────────────────────────────────────────── */
    .screen-header {
      display: flex;
      align-items: center;
      height: var(--header-h);
      padding: 0 16px;
      border-bottom: 0.5px solid var(--border2);
      flex-shrink: 0;
      gap: 10px;
    }
    .screen-title {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text3);
    }
    .header-actions { margin-left: auto; display: flex; gap: 6px; }
    .icon-btn {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      color: var(--text3);
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:active { background: var(--bg4); color: var(--text); }
    .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

    /* ── CLOCK SUB-NAV ─────────────────────────────────────────────────── */
    #clock-subnav {
      display: flex;
      height: var(--subnav-h);
      border-bottom: 0.5px solid var(--border2);
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    #clock-subnav::-webkit-scrollbar { display: none; }

    .subnav-btn {
      flex-shrink: 0;
      padding: 0 16px;
      height: 100%;
      display: flex;
      align-items: center;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text4);
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .subnav-btn.active { color: var(--text); border-bottom-color: var(--green); }

    /* ── CLOCK SUB-PANELS ──────────────────────────────────────────────── */
    .clock-panel {
      display: none;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .clock-panel.active { display: flex; flex-direction: column; }

    /* ── GOALS LIST ────────────────────────────────────────────────────── */
    #goal-list {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .goalcard {
      background: var(--bg3);
      border: 0.5px solid var(--border2);
      border-radius: 14px;
      padding: 16px;
      transition: background 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      cursor: pointer;
    }
    .goalcard:active { background: var(--bg4); }
    .goalcard.live {
      border-color: #4a8c5c;
      background: var(--bg3);
      box-shadow: 0 0 0 0.5px #4a8c5c inset;
    }
    .goalcard.locked { opacity: 0.42; pointer-events: none; }

    .gc-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .gc-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .gc-name {
      flex: 1;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      color: var(--text2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .goalcard.live .gc-name { color: #b8f0c8; }
    .gc-actions {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }
    .gc-action-btn {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 7px;
      color: var(--text4);
      font-size: 14px;
      transition: background 0.15s;
    }
    .gc-action-btn:active { background: var(--bg); color: var(--text2); }

    /* tier bar */
    .gc-bar {
      position: relative;
      height: 4px;
      background: var(--bg2);
      border-radius: 2px;
      margin-bottom: 6px;
    }
    .gc-bar-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      border-radius: 2px;
      opacity: 0.85;
      transition: width 0.3s ease;
    }
    .gc-tick {
      position: absolute;
      top: -3px;
      width: 1.5px;
      height: 10px;
      background: var(--border);
      border-radius: 1px;
    }

    .gc-scale {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 8px;
      color: var(--text4);
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }

    .gc-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
    }
    .gc-tier-pill {
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 20px;
      background: var(--bg4);
      border: 0.5px solid var(--border);
      color: var(--text4);
    }

    /* break badge */
    .gc-break-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--amber);
      background: var(--amber-bg);
      border: 0.5px solid var(--amber-border);
      border-radius: 20px;
      padding: 3px 8px;
      letter-spacing: 0.06em;
    }

    /* empty state */
    .list-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text4);
      letter-spacing: 0.06em;
      text-align: center;
    }

    /* ── SHOP ──────────────────────────────────────────────────────────── */
    #shop-panel {
      display: none;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    #shop-panel.active { display: flex; }

    #shop-filter {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--border2);
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #shop-filter::-webkit-scrollbar { display: none; }

    .filter-chip {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--text3);
      background: var(--bg3);
      border: 0.5px solid var(--border2);
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .filter-chip.active {
      color: var(--green);
      background: var(--green-bg);
      border-color: var(--green-border);
    }

    #shop-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── WHEEL PANE ────────────────────────────────────────────────────── */
    .wheel-pane {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 16px 24px;
      gap: 16px;
    }
    .wheel-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .wheel-disc {
      position: absolute;
      inset: 0;
      transition: transform 4.2s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    }
    .wheel-pointer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }
    .wheel-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      justify-content: center;
    }
    .wheel-legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text3);
      letter-spacing: 0.05em;
    }
    .wheel-legend-dot {
      width: 8px; height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .spin-btn {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.08em;
      font-weight: 600;
      color: var(--green);
      background: var(--green-bg);
      border: 0.5px solid var(--green-border);
      transition: opacity 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .spin-btn:active:not(:disabled) { opacity: 0.75; transform: scale(0.98); }
    .spin-btn:disabled { opacity: 0.35; color: var(--text4); background: var(--bg4); border-color: var(--border2); }

    .holding-section {
      width: 100%;
      background: var(--bg3);
      border: 0.5px solid var(--border2);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .holding-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text4);
      margin-bottom: 12px;
    }
    .holding-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .clip-dot {
      width: 26px; height: 26px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: rgba(0,0,0,0.8);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      border: 2.5px solid transparent;
      opacity: 0.5;
      -webkit-tap-highlight-color: transparent;
    }
    .clip-dot.selected {
      border-color: white;
      opacity: 1;
    }

    .ceil-badge {
      width: 100%;
      background: var(--bg3);
      border: 0.5px solid var(--border2);
      border-radius: 14px;
      padding: 12px 16px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text3);
    }
    .ceil-badge b { font-weight: 600; }
    .ceil-explain {
      font-size: 9px;
      color: var(--text4);
      display: block;
      margin-top: 4px;
    }

    .spin-history {
      width: 100%;
    }
    .spin-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 0.5px solid var(--border2);
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
    }
    .spin-seg {
      width: 8px; height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* ── SCROLL CONTENT WRAPPER ────────────────────────────────────────── */
    .scroll-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* ── PLACEHOLDER PANEL ─────────────────────────────────────────────── */
    .placeholder-panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: var(--text4);
    }
    .placeholder-panel span {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
    }
    .placeholder-panel svg {
      width: 28px; height: 28px;
      stroke: var(--text4);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.4;
    }

    /* ── SESSION SCREEN ────────────────────────────────────────────────── */
    #session-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      padding-top: var(--sat);
      padding-bottom: var(--sab);
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 100;
      will-change: transform;
    }
    #session-screen.open { transform: translateY(0); }

    .session-header {
      display: flex;
      align-items: center;
      height: var(--header-h);
      padding: 0 16px;
      border-bottom: 0.5px solid var(--border2);
      flex-shrink: 0;
      gap: 10px;
    }
    .session-back {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px;
      color: var(--text3);
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .session-back:active { background: var(--bg4); }
    .session-back svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .session-goal-name {
      flex: 1;
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-goal-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* main session body */
    .session-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 24px 0;
      gap: 0;
    }

    /* phase label */
    .session-phase {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text4);
      margin-bottom: 16px;
    }

    /* big timer */
    .session-timer {
      font-family: var(--mono);
      font-size: clamp(52px, 18vw, 88px);
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--green);
      transition: color 0.5s;
      margin-bottom: 10px;
    }
    .session-timer.on-break { color: var(--amber); }
    .session-timer.idle { color: var(--text3); }

    /* sub label under timer */
    .session-sub {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text4);
      margin-bottom: 28px;
      min-height: 16px;
      text-align: center;
    }

    /* tier progress bar */
    .session-bar-wrap {
      width: 100%;
      margin-bottom: 8px;
    }
    .session-bar {
      position: relative;
      height: 5px;
      background: var(--bg4);
      border-radius: 3px;
      overflow: visible;
    }
    .session-bar-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      border-radius: 3px;
      transition: width 1s linear;
    }
    .session-bar-tick {
      position: absolute;
      top: -3px;
      width: 2px; height: 11px;
      background: var(--border);
      border-radius: 1px;
    }
    .session-bar-scale {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 8px;
      color: var(--text4);
      letter-spacing: 0.06em;
      margin-top: 6px;
      margin-bottom: 20px;
    }

    /* break info */
    .session-break-info {
      width: 100%;
      padding: 10px 14px;
      background: var(--amber-bg);
      border: 0.5px solid var(--amber-border);
      border-radius: 10px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--amber);
      margin-bottom: 12px;
      display: none;
    }
    .session-break-info.visible { display: block; }

    .session-break-warning {
      width: 100%;
      padding: 10px 14px;
      background: rgba(196,106,106,0.1);
      border: 0.5px solid rgba(196,106,106,0.3);
      border-radius: 10px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--red);
      margin-bottom: 12px;
      display: none;
      animation: pulse 1s infinite;
    }
    .session-break-warning.visible { display: block; }

    /* action buttons */
    .session-actions {
      width: 100%;
      padding: 20px 24px;
      padding-bottom: max(24px, var(--sab));
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .session-btn {
      width: 100%;
      height: 54px;
      border-radius: 14px;
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.08em;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .session-btn:active { opacity: 0.75; transform: scale(0.98); }

    .session-btn-punch-out {
      background: rgba(196,106,106,0.15);
      border: 0.5px solid rgba(196,106,106,0.35);
      color: var(--red);
    }
    .session-btn-break {
      background: var(--amber-bg);
      border: 0.5px solid var(--amber-border);
      color: var(--amber);
    }
    .session-btn-focus {
      background: var(--green-bg);
      border: 0.5px solid var(--green-border);
      color: var(--green);
      display: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    /* ── REWARDS JAR ───────────────────────────────────────────────────── */
    .jar-pane {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .jar-visual-row {
      display: flex;
      gap: 16px;
      align-items: flex-end;
    }
    .jar-svg-wrap { flex-shrink: 0; }
    .jar-stats {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .jar-total-amt {
      font-family: var(--mono);
      font-size: 36px;
      font-weight: 700;
      color: var(--green);
      line-height: 1;
    }
    .jar-total-label {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text4);
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .prize-lines { display: flex; flex-direction: column; gap: 8px; }
    .prize-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--bg3);
      border: 0.5px solid var(--border2);
      border-radius: 11px;
    }
    .prize-row.reached { border-color: var(--green-border); background: var(--green-bg); }
    .prize-row.next { border-color: var(--border); }
    .prize-key {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text4);
      width: 32px;
      flex-shrink: 0;
    }
    .prize-row.reached .prize-key { color: var(--green); }
    .prize-lbl {
      flex: 1;
      font-size: 13px;
      color: var(--text2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .prize-amt {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text3);
      flex-shrink: 0;
    }
    .prize-row.reached .prize-amt { color: var(--green); }

    .ledger-section {
      background: var(--bg3);
      border: 0.5px solid var(--border2);
      border-radius: 14px;
      overflow: hidden;
    }
    .ledger-header {
      padding: 12px 16px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text4);
      border-bottom: 0.5px solid var(--border2);
    }
    .ledger-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      border-bottom: 0.5px solid var(--border2);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text3);
    }
    .ledger-row:last-child { border-bottom: none; }
    .ledger-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
    .ledger-amt { margin-left: auto; color: var(--green); font-size: 11px; }
    .ledger-empty {
      padding: 20px 16px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text4);
      text-align: center;
    }

    /* ── WEEKLY ────────────────────────────────────────────────────────── */
    .weekly-pane { padding: 16px; display: flex; flex-direction: column; gap: 4px; }
    .weekly-header {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text4);
      letter-spacing: 0.08em;
      padding: 4px 0 14px;
    }
    .weekly-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 0.5px solid var(--border2);
    }
    .weekly-row:last-child { border-bottom: none; }
    .weekly-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .weekly-name { flex: 1; font-size: 14px; color: var(--text2); }
    .weekly-stats {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
      text-align: right;
      line-height: 1.6;
    }

    /* ── TICKETS ───────────────────────────────────────────────────────── */
    .tickets-pane { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

    .tickets-summary {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border: 0.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .tickets-summary-cell {
      padding: 14px 8px;
      text-align: center;
      border-right: 0.5px solid var(--border);
    }
    .tickets-summary-cell:last-child { border-right: none; }
    .tickets-summary-count {
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
    }
    .tickets-summary-label {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.1em;
      color: var(--text4);
      margin-top: 5px;
    }

    .tickets-filter {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: var(--bg3);
      border: 0.5px solid var(--border);
      border-radius: 9px;
      overflow: hidden;
    }
    .ticket-filter-btn {
      padding: 9px 6px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.05em;
      color: var(--text3);
      border-right: 0.5px solid var(--border2);
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .ticket-filter-btn:last-child { border-right: none; }
    .ticket-filter-btn.active { background: var(--bg4); color: var(--text); font-weight: 600; }

    .ticket-card {
      background: var(--bg3);
      border: 0.5px solid var(--border);
      border-left-width: 3px;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ticket-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }
    .ticket-card-title {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }
    .ticket-card-sub {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
      margin-top: 3px;
    }
    .ticket-device-badge {
      font-family: var(--mono);
      font-size: 9px;
      border-radius: 20px;
      padding: 3px 10px;
      letter-spacing: 0.1em;
      flex-shrink: 0;
    }
    .ticket-code {
      font-family: var(--mono);
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--text);
      text-align: center;
      line-height: 1;
      padding: 6px 0;
      cursor: pointer;
    }
    .ticket-code-hint {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
      text-align: center;
      margin-top: 6px;
    }
    .ticket-redeem-btn {
      width: 100%;
      padding: 11px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--green);
      background: rgba(106,173,126,0.1);
      border: 0.5px solid rgba(106,173,126,0.25);
      border-radius: 9px;
      letter-spacing: 0.05em;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }
    .ticket-redeem-btn:active { opacity: 0.7; }

    .ticket-history-card {
      background: var(--bg3);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ticket-history-info { flex: 1; min-width: 0; }
    .ticket-history-title {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text2);
    }
    .ticket-history-code {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text4);
      text-decoration: line-through;
      letter-spacing: 0.08em;
      margin-left: 8px;
    }
    .ticket-history-sub {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text4);
      margin-top: 4px;
    }
    .ticket-status-pill {
      font-family: var(--mono);
      font-size: 9px;
      border-radius: 20px;
      padding: 3px 10px;
      letter-spacing: 0.1em;
      flex-shrink: 0;
    }

    .tickets-empty {
      padding: 40px 0;
      text-align: center;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text4);
      letter-spacing: 0.05em;
    }

    /* ── SHOP CATALOG ──────────────────────────────────────────────────── */
    .shop-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1px;
      background: var(--border2);
      border: 0.5px solid var(--border2);
      border-radius: 14px;
      overflow: hidden;
      margin: 0 12px 4px;
    }
    .shop-stat {
      background: var(--bg3);
      padding: 14px 10px;
      text-align: center;
    }
    .shop-stat-num {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .shop-stat-lbl {
      font-family: var(--mono);
      font-size: 8px;
      color: var(--text4);
      letter-spacing: 0.06em;
      line-height: 1.4;
    }

    .shop-band {
      padding: 20px 16px 4px;
    }
    .shop-band-eyebrow {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--text4);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .shop-band-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .shop-band-sub {
      font-size: 13px;
      color: var(--text3);
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 12px;
    }
    @media (min-width: 500px) { .cat-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 700px) { .cat-grid { grid-template-columns: repeat(4, 1fr); } }

    .cat-card {
      background: var(--bg3);
      border: 0.5px solid var(--border2);
      border-radius: 14px;
      padding: 16px 14px;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }
    .cat-card:active { background: var(--bg4); }
    .cat-card.active { background: var(--bg4); border-color: var(--gold); }
    .cat-card.add {
      align-items: center;
      justify-content: center;
      color: var(--text4);
      border-style: dashed;
    }
    .cat-card.add:active { color: var(--gold); }

    .cat-idx {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text4);
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }
    .cat-icon { margin-bottom: 10px; }
    .cat-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .cat-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cat-cap {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text4);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      flex: 1;
    }
    .cat-price {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--gold);
      margin-top: 10px;
    }

    /* buy panel — slides in below the grid */
    .cat-buy-panel {
      margin: 0 12px 12px;
      background: var(--bg3);
      border: 0.5px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.28s ease, opacity 0.2s;
      opacity: 0;
    }
    .cat-buy-panel.open { max-height: 400px; opacity: 1; }
    .cat-buy-inner { padding: 18px; }
    .cat-buy-item-lbl {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text3);
      margin-bottom: 14px;
      line-height: 1.6;
    }
    .cat-buy-confirm {
      width: 100%;
      height: 48px;
      border-radius: 11px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--green);
      background: var(--green-bg);
      border: 0.5px solid var(--green-border);
      margin-top: 12px;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }
    .cat-buy-confirm:active { opacity: 0.7; }
    .cat-buy-msg {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text3);
      line-height: 1.6;
    }

    .shop-foot {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text4);
      text-align: center;
      padding: 8px 16px 20px;
      letter-spacing: 0.04em;
    }

    /* ── PUNCH LOG ─────────────────────────────────────────────────────── */
    .log-pane { padding: 12px; display: flex; flex-direction: column; gap: 20px; }

    .log-date-group { display: flex; flex-direction: column; gap: 2px; }

    .log-date-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text4);
      padding: 4px 4px 8px;
    }

    .log-entry {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      background: var(--bg3);
      border: 0.5px solid var(--border2);
      border-radius: 12px;
    }

    .log-entry-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .log-entry-info { flex: 1; min-width: 0; }

    .log-entry-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 3px;
    }

    .log-entry-meta {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .log-tier-pill {
      font-size: 8px;
      letter-spacing: 0.08em;
      padding: 2px 6px;
      border-radius: 20px;
      border: 0.5px solid currentColor;
      opacity: 0.85;
    }

    .log-clips-badge {
      display: flex;
      align-items: center;
      gap: 3px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text4);
    }

    .log-entry-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }

    .log-entry-dur {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
    }

    .log-clip-dots { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; max-width: 60px; }

    .log-clip-dot {
      width: 8px; height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .log-empty {
      padding: 48px 20px;
      text-align: center;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text4);
      letter-spacing: 0.05em;
    }

    /* ── BOTTOM SHEET ──────────────────────────────────────────────────── */
    #bottom-sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0);
      z-index: 200;
      display: none;
      transition: background 0.25s;
    }
    #bottom-sheet-overlay.open { display: block; background: rgba(0,0,0,0.55); }

    #bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      background: var(--bg3);
      border-top: 0.5px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding-bottom: calc(20px + var(--sab));
      z-index: 201;
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
      will-change: transform;
    }
    #bottom-sheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 12px auto 4px;
    }
    .sheet-goal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px 14px;
      border-bottom: 0.5px solid var(--border2);
    }
    .sheet-goal-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .sheet-goal-name {
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }
    .sheet-actions { padding: 8px 0; }
    .sheet-action {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      width: 100%;
      text-align: left;
      font-size: 15px;
      color: var(--text);
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .sheet-action:active { background: var(--bg4); }
    .sheet-action svg {
      width: 20px; height: 20px;
      stroke: currentColor; fill: none;
      stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
      color: var(--text3);
      flex-shrink: 0;
    }
    .sheet-action.destructive { color: var(--red); }
    .sheet-action.destructive svg { color: var(--red); }
    .sheet-divider { height: 0.5px; background: var(--border2); margin: 4px 0; }

    /* ── REORDER MODE ──────────────────────────────────────────────────── */
    #reorder-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--amber-bg);
      border-bottom: 0.5px solid var(--amber-border);
      flex-shrink: 0;
    }
    #reorder-bar.visible { display: flex; }
    .reorder-hint {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--amber);
      letter-spacing: 0.06em;
    }
    .reorder-done-btn {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--green);
      background: var(--green-bg);
      border: 0.5px solid var(--green-border);
      border-radius: 8px;
      padding: 6px 14px;
      -webkit-tap-highlight-color: transparent;
    }

    .goalcard.reorder-mode {
      cursor: grab;
      touch-action: none;
    }
    .goalcard.dragging {
      opacity: 0.4;
      pointer-events: none;
    }
    .goalcard.drag-over {
      border-color: var(--amber);
      background: var(--amber-bg);
    }
    .gc-drag-handle {
      display: none;
      color: var(--text4);
      font-size: 16px;
      padding: 0 4px;
      cursor: grab;
      flex-shrink: 0;
    }
    .reorder-mode .gc-drag-handle { display: block; }
    .reorder-mode .gc-actions { display: none; }

    /* ── TABLET ADJUSTMENTS ────────────────────────────────────────────── */
    @media (min-width: 600px) {
      #goal-list { padding: 16px; gap: 12px; }
      .goalcard { padding: 20px; }
      .gc-name { font-size: 15px; }
      #shop-list { padding: 16px; }
    }

    @media (min-width: 900px) {
      :root { --nav-h: 72px; }
      .nav-btn span { font-size: 10px; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ── MAIN CONTENT ── -->
  <div id="main">

    <!-- CLOCK TAB -->
    <div class="tab-panel active" id="panel-clock">

      <!-- header -->
      <div class="screen-header">
        <span class="screen-title">Clock</span>
        <div class="header-actions">
          <button class="icon-btn" title="Add goal">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>

      <!-- clock sub-nav -->
      <div id="clock-subnav">
        <button class="subnav-btn active" onclick="switchClock('goals')">Goals</button>
        <button class="subnav-btn" onclick="switchClock('log')">Log</button>
        <button class="subnav-btn" onclick="switchClock('wheel')">Wheel</button>
        <button class="subnav-btn" onclick="switchClock('jar')">Rewards Jar</button>
        <button class="subnav-btn" onclick="switchClock('weekly')">Weekly</button>
        <button class="subnav-btn" onclick="switchClock('tickets')">Tickets</button>
      </div>

      <!-- goals sub-panel (default) -->
      <div class="clock-panel active" id="cp-goals">
        <div id="reorder-bar">
          <span class="reorder-hint">⠿ drag to reorder</span>
          <button class="reorder-done-btn" onclick="exitReorderMode()">Done</button>
        </div>
        <div id="goal-list">
          <div class="list-empty">loading…</div>
        </div>
      </div>

      <!-- log sub-panel -->
      <div class="clock-panel" id="cp-log">
        <div class="scroll-content">
          <div class="log-pane" id="log-pane-inner"></div>
        </div>
      </div>

      <!-- wheel sub-panel -->
      <div class="clock-panel" id="cp-wheel">
        <div class="scroll-content">
          <div class="wheel-pane" id="wheel-pane-inner">
            <!-- wheel renders here -->
          </div>
        </div>
      </div>

      <!-- jar sub-panel -->
      <div class="clock-panel" id="cp-jar">
        <div class="scroll-content">
          <div class="jar-pane" id="jar-pane-inner"></div>
        </div>
      </div>


      <!-- weekly sub-panel -->
      <div class="clock-panel" id="cp-weekly">
        <div class="scroll-content">
          <div class="weekly-pane" id="weekly-pane-inner"></div>
        </div>
      </div>

      <!-- tickets sub-panel -->
      <div class="clock-panel" id="cp-tickets">
        <div class="scroll-content">
          <div class="tickets-pane" id="tickets-pane-inner"></div>
        </div>
      </div>

    </div><!-- /panel-clock -->

    <!-- SHOP TAB -->
    <div class="tab-panel" id="panel-shop">
      <div class="screen-header">
        <span class="screen-title">Shop</span>
      </div>

      <!-- filter chips -->
      <div id="shop-filter">
        <button class="filter-chip active" onclick="setShopFilter('all', this)">All</button>
        <button class="filter-chip" onclick="setShopFilter('realworld', this)">Real World</button>
        <button class="filter-chip" onclick="setShopFilter('mechanics', this)">Mechanics</button>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp }                        from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, off } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyBHi-TrRw-IZLxXZY-ppbm5ZTP_rWOJxD0",
      authDomain:        "flomodoro-v4.firebaseapp.com",
      projectId:         "flomodoro-v4",
      databaseURL:       "https://flomodoro-v4-default-rtdb.firebaseio.com",
      storageBucket:     "flomodoro-v4.firebasestorage.app",
      messagingSenderId: "214364487895",
      appId:             "1:214364487895:web:e24bcc5adac224032b3092"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    // ── write helpers ────────────────────────────────────────────────────
    function fbSet(path, value) {
      return set(ref(db, path), value);
    }

    // ── sync session live (called on every session state change) ─────────
    window.fbSyncSession = function(sessionData) {
      fbSet('session', sessionData || null);
    };

    // ── sync wallet/tickets/catalog on change ────────────────────────────
    window.fbSyncState = function(data) {
      fbSet('wallet',  data.wallet  ?? null);
      fbSet('goals',   data.goals   ?? null);
      fbSet('tickets', data.tickets ?? null);
      fbSet('catalog', data.catalog ?? null);
      fbSet('jar',     data.jar     ?? null);
      fbSet('weekly',  data.weekly  ?? null);
    };

    window.fbPushRedemption = function(redemption) {
      fbSet('redemptions/active', redemption ?? null);
    };

    // ── listen for session changes (so PC can see mobile session) ────────
    const sessionRef = ref(db, 'session');
    onValue(sessionRef, (snapshot) => {
      const data = snapshot.val();
      if (window.onFirebaseSession) window.onFirebaseSession(data);
    });

    // ── listen for full state changes (multi-device sync) ─────────────────
    const stateRef = ref(db, '/');
    onValue(stateRef, (snapshot) => {
      const data = snapshot.val();
      if (window.onFirebaseState) window.onFirebaseState(data);
    });

    window._fbReady = true;
    if (window.onFirebaseReady) window.onFirebaseReady();
  </script>

<script>
  // ══════════════════════════════════════════════════════════════════════
  // STATE — localStorage-backed, Firebase shape ready
  // ══════════════════════════════════════════════════════════════════════
  const S = (() => {
    const KEYS = {
      goals:       'fv4_goals',
      active:      'fv4_active',
      wheel:       'fv4_wheel',
      jar:         'fv4_jar',
      tickets:     'fv4_tickets',
      catalog:     'fv4_catalog',
      redemptions: 'fv4_redemptions',
      log:         'fv4_log',
    };

    const CLIP_COLORS = [
      { id:'red',    hex:'#c46a6a', label:'red'    },
      { id:'blue',   hex:'#7a9ade', label:'blue'   },
      { id:'green',  hex:'#6aad7e', label:'green'  },
      { id:'amber',  hex:'#cd8a3a', label:'amber'  },
      { id:'purple', hex:'#9a7ade', label:'purple' },
      { id:'teal',   hex:'#5aadcd', label:'teal'   },
      { id:'gold',   hex:'#d9b44a', label:'gold', isGold:true },
    ];

    function load(k)   { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
    function save(k,v) { localStorage.setItem(k, JSON.stringify(v)); }
    function del(k)    { localStorage.removeItem(k); }

    function goals()   { return load(KEYS.goals)  || []; }
    function active()  { return load(KEYS.active) || null; }
    function log()     { return load(KEYS.log)    || []; }
    function catalog() { return load(KEYS.catalog) || []; }
    function tickets() { return load(KEYS.tickets) || []; }
    function redemptions() { return load(KEYS.redemptions) || []; }

    function wheel(gid) {
      const w = load(KEYS.wheel) || {};
      return w[gid] || { holding:[], cashed:0, spins:[], pending:false, debt:0 };
    }

    function jar() {
      return load(KEYS.jar) || { total:0, ledger:[], mini:'', miniAmt:15, mid:'', midAmt:40, moon:'', moonAmt:120 };
    }

    function saveGoals(v)          { save(KEYS.goals, v); }
    function saveActive(v)         { v ? save(KEYS.active, v) : del(KEYS.active); }
    function saveLog(v)            { save(KEYS.log, v); }
    function saveCatalog(v)        { save(KEYS.catalog, v); }
    function saveTickets(v)        { save(KEYS.tickets, v); }
    function saveJar(v)            { save(KEYS.jar, v); }
    function saveWheel(gid, v)     { const w = load(KEYS.wheel)||{}; w[gid]=v; save(KEYS.wheel, w); }

    function goalById(id) { return goals().find(g => String(g.id)===String(id)) || null; }

    function randomClip() {
      const pool = [...CLIP_COLORS.slice(0,6),...CLIP_COLORS.slice(0,6),...CLIP_COLORS.slice(0,6),
                    ...CLIP_COLORS.slice(0,6),...CLIP_COLORS.slice(0,6), CLIP_COLORS[6]];
      return pool[Math.floor(Math.random()*pool.length)];
    }

    function drawClips(n) { const d=[]; for(let i=0;i<n;i++) d.push(randomClip()); return d; }

    function addToHolding(gid, clips) {
      const w = wheel(gid); w.debt = w.debt||0; let toAdd = clips.slice();
      if (w.debt>0&&toAdd.length>0) { const p=Math.min(w.debt,toAdd.length); w.debt-=p; toAdd=toAdd.slice(p); }
      w.holding = w.holding.concat(toAdd); saveWheel(gid, w);
    }

    function addToJar(amount, source) {
      const j = jar();
      j.total = Math.round(((j.total||0)+amount)*100)/100;
      j.ledger = j.ledger||[];
      j.ledger.unshift({ ts:Date.now(), amount, source });
      if (j.ledger.length>50) j.ledger=j.ledger.slice(0,50);
      saveJar(j);
    }

    function totalPato() {
      return Math.round(goals().filter(g=>g.kind!=='blocker')
        .reduce((a,g)=>a+(g.patoWallet||0),0)*100)/100;
    }

    function spendPato(amount) {
      const gs = goals();
      const spendable = gs.filter(g=>g.kind!=='blocker'&&(g.patoWallet||0)>0)
        .sort((a,b)=>(b.patoWallet||0)-(a.patoWallet||0));
      let rem = amount;
      for (const g of spendable) {
        if (rem<=0) break;
        const take = Math.min(g.patoWallet, rem);
        g.patoWallet = Math.round((g.patoWallet-take)*100)/100;
        rem = Math.round((rem-take)*100)/100;
      }
      saveGoals(gs);
    }

    function addRedemption(entry) {
      const r = redemptions(); r.unshift({ ts:Date.now(), ...entry });
      save(KEYS.redemptions, r);
    }

    function today() {
      const d = new Date();
      return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    }

    function focusElapsedSecs(act) {
      const a = act || active(); if (!a) return 0;
      const now = Date.now();
      const totalSecs = Math.floor((now - a.punchInAt) / 1000);
      const breakSecs = (a.breakUsedSecs||0) + (a.breakActive ? Math.floor((now-(a.breakStartAt||now))/1000) : 0);
      return Math.max(0, totalSecs - breakSecs);
    }

    // ── seed demo data on first run ──────────────────────────────────────
    function ensureSeed() {
      if (load('fv4_seeded')) return;
      save('fv4_seeded', true);
      saveGoals([
        { id:1, name:'Study',        color:'#6aad7e', kind:'normal', patoWallet:142.5, dailySecs:{}, totalSecs:0 },
        { id:2, name:'Exercise',     color:'#7a9ade', kind:'normal', patoWallet:0,     dailySecs:{}, totalSecs:0 },
        { id:3, name:'Side Project', color:'#9a7ade', kind:'normal', patoWallet:0,     dailySecs:{}, totalSecs:0, locked:true },
      ]);
      saveCatalog([
        { id:101, name:'Coffee run',   categoryId:'food',       icon:'coffee',   price:12,  kind:'real-world', createdAt:Date.now() },
        { id:102, name:'Movie night',  categoryId:'screen',     icon:'film',     price:25,  kind:'real-world', createdAt:Date.now() },
        { id:103, name:'New game',     categoryId:'tech',       icon:'gamepad',  price:80,  kind:'real-world', createdAt:Date.now() },
        { id:104, name:'Sneakers',     categoryId:'apparel',    icon:'footwear', price:120, kind:'real-world', createdAt:Date.now() },
        { id:105, name:'Day trip',     categoryId:'experience', icon:'map',      price:60,  kind:'real-world', createdAt:Date.now() },
        { id:106, name:'Mystery box',  categoryId:'mystery',    icon:'gift',     price:35,  kind:'real-world', createdAt:Date.now() },
        { id:107, name:'Key Glass',    categoryId:'system',     icon:'key',      price:10,  kind:'mechanics',  createdAt:Date.now() },
        { id:108, name:'Key Shard',    categoryId:'system',     icon:'shard',    price:15,  kind:'mechanics',  createdAt:Date.now() },
        { id:109, name:'Keystone',     categoryId:'system',     icon:'gem',      price:50,  kind:'mechanics',  createdAt:Date.now() },
      ]);
      saveJar({ total:47, ledger:[
        { ts:Date.now()-3600000,   amount:8,  source:'Study · T2'    },
        { ts:Date.now()-86400000,  amount:3,  source:'Exercise · T1' },
        { ts:Date.now()-172800000, amount:14, source:'Study · T3'    },
      ], mini:'Coffee + pastry', miniAmt:15, mid:'New book', midAmt:40, moon:'Weekend trip', moonAmt:120 });
      saveTickets([
        { code:'A7K2', rewardApp:'YouTube',   durationMins:30, goalName:'Study',    tier:'T2', device:'mobile', status:'active',   earnedAt:Date.now()-3600000,   expiresAt:Date.now()+7200000  },
        { code:'B3M9', rewardApp:'Instagram', durationMins:20, goalName:'Exercise', tier:'T1', device:'mobile', status:'redeemed', earnedAt:Date.now()-86400000,  expiresAt:Date.now()-3600000  },
        { code:'C5X1', rewardApp:'Netflix',   durationMins:60, goalName:'Study',    tier:'T3', device:'mobile', status:'expired',  earnedAt:Date.now()-172800000, expiresAt:Date.now()-86400000 },
      ]);
    }

    function dateStrDaysAgo(n) {
      const d = new Date();
      d.setDate(d.getDate() - n);
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function ensurePatoFields(g) {
      if (g.patoStep        == null) g.patoStep        = 0.5;
      if (g.patoDayInCycle  == null) g.patoDayInCycle  = 1;
      if (g.patoMultiplier  == null) g.patoMultiplier  = 1;
      if (g.patoWallet      == null) g.patoWallet      = 0;
      if (g.patoLastEarnedDate === undefined) g.patoLastEarnedDate = null;
    }

    function syncPatoStreak(g) {
      const t = today();
      if (g.patoLastEarnedDate === t || g.patoLastEarnedDate === null) return;
      if (g.patoLastEarnedDate !== dateStrDaysAgo(1)) {
        g.patoDayInCycle = 1;
        g.patoMultiplier = 1;
      }
    }

    function tryEarnPato(g, todaySecs) {
      const t = today();
      if (g.patoLastEarnedDate === t) return false; // already earned today
      if (!g.mvdVal || todaySecs < g.mvdVal) return false; // MVD not cleared
      const payout = Math.round(g.patoDayInCycle * g.patoMultiplier * 100) / 100;
      g.patoWallet = Math.round((g.patoWallet + payout) * 100) / 100;
      g.patoLastEarnedDate = t;
      if (g.patoDayInCycle >= 5) {
        g.patoMultiplier = Math.round((g.patoMultiplier + g.patoStep) * 100) / 100;
        g.patoDayInCycle = 1;
      } else {
        g.patoDayInCycle += 1;
      }
      return true;
    }

    function processPato() {
      const gs = goals(); let changed = false;
      gs.forEach(g => {
        if (g.kind === 'blocker') return;
        const before = JSON.stringify([g.patoStep, g.patoDayInCycle, g.patoMultiplier, g.patoWallet, g.patoLastEarnedDate]);
        ensurePatoFields(g);
        syncPatoStreak(g);
        const todayKey = today();
        const todaySecs = (g.dailySecs && g.dailySecs[todayKey]) || 0;
        tryEarnPato(g, todaySecs);
        if (JSON.stringify([g.patoStep, g.patoDayInCycle, g.patoMultiplier, g.patoWallet, g.patoLastEarnedDate]) !== before) changed = true;
      });
      if (changed) saveGoals(gs);
    }

    return { KEYS, CLIP_COLORS, goals, active, log, catalog, tickets, redemptions, wheel, jar,
             saveGoals, saveActive, saveLog, saveCatalog, saveTickets, saveJar, saveWheel,
             goalById, drawClips, addToHolding, addToJar, addRedemption,
             totalPato, spendPato, today, focusElapsedSecs, ensureSeed,
             ensurePatoFields, syncPatoStreak, tryEarnPato, processPato };
  })();

  // ── init ──────────────────────────────────────────────────────────────
  // Clear any stale local state so Firebase is always the source of truth
  ['fv4_goals','fv4_catalog','fv4_tickets','fv4_jar','fv4_wheel','fv4_log','fv4_redemptions'].forEach(k => localStorage.removeItem(k));
  localStorage.removeItem('fv4_seeded');

  // Don't seed yet — wait for Firebase to respond first.
  // onFirebaseState will either load remote state or fall back to seed.
  // If Firebase hasn't responded within 3 seconds, seed and render anyway.
  let _initDone = false;
  function _doInit(fromFirebase) {
    if (_initDone) return;
    _initDone = true;
    if (!fromFirebase) S.ensureSeed();
    renderGoals();
    const _resumeAct = S.active();
    if (_resumeAct) {
      const _resumeGoal = S.goalById(_resumeAct.goalId);
      if (_resumeGoal) openSession(_resumeGoal.name, _resumeGoal.color || '#6aad7e');
    }
  }
  setTimeout(() => _doInit(false), 3000); // fallback if Firebase is slow

  // ══════════════════════════════════════════════════════════════════════
  // GOALS LIST — driven by S
  // ══════════════════════════════════════════════════════════════════════
  function renderGoals() {
    const list  = document.getElementById('goal-list');
    const goals = S.goals();
    if (!goals.length) { list.innerHTML = '<div class="list-empty">no goals yet — tap + to add one</div>'; return; }

    list.innerHTML = goals.map(g => {
      const act    = S.active();
      const isLive = act && String(act.goalId) === String(g.id);
      const locked = g.locked && !isLive;
      const todayKey  = S.today();
      const todaySecs = (g.dailySecs && g.dailySecs[todayKey]) || 0;

      // tier bar — progress toward BSD using real thresholds if available
      const hasTiers = g.mvdVal && g.bsdVal;
      const pct      = hasTiers
        ? Math.min(100, (todaySecs / g.bsdVal) * 100)
        : Math.min(100, todaySecs / 3600 * 33);

      // tier label
      let tierLabel = '—';
      let tierColor = 'var(--text4)';
      if (hasTiers) {
        if      (todaySecs >= g.bsdVal) { tierLabel = 'BSD'; tierColor = 'var(--blue)';  }
        else if (todaySecs >= g.avVal)  { tierLabel = 'AV';  tierColor = 'var(--amber)'; }
        else if (todaySecs >= g.mvdVal) { tierLabel = 'MVD'; tierColor = 'var(--green)'; }
        else                            { tierLabel = '—';   tierColor = 'var(--text4)'; }
      }

      // tick positions (MVD and AV as % of BSD)
      const mvdTick = hasTiers ? Math.min(99, (g.mvdVal / g.bsdVal) * 100) : 33;
      const avTick  = hasTiers ? Math.min(99, (g.avVal  / g.bsdVal) * 100) : 66;
      return `
        <div class="goalcard${isLive?' live':''}${locked?' locked':''}" id="gc-${g.id}" onclick="onGoalTap(${g.id})" draggable="true">
          <div class="gc-top">
            <span class="gc-drag-handle">⠿</span>
            <div class="gc-dot" style="background:${g.color||'#6aad7e'};"></div>
            <span class="gc-name">${g.name}</span>
            <div class="gc-actions">
              <button class="gc-action-btn" onclick="event.stopPropagation();openSheet(${g.id})">⋯</button>
            </div>
          </div>
          <div class="gc-bar">
            <div class="gc-bar-fill" style="width:${pct}%;background:${g.color||'#6aad7e'};"></div>
            <span class="gc-tick" style="left:${mvdTick}%;"></span>
            <span class="gc-tick" style="left:${avTick}%;"></span>
          </div>
          <div class="gc-scale"><span>MVD</span><span>AV</span><span>BSD</span></div>
          <div class="gc-meta">
            <span>${isLive ? '<span style="color:var(--green);">● live</span>' : fmtHrMin(todaySecs)+' today'}</span>
            <span class="gc-tier-pill" style="color:${locked?'var(--text4)':tierColor};border-color:${locked?'var(--border2)':tierColor+'44'};background:${locked?'var(--bg4)':tierColor+'11'};">${locked?'locked':tierLabel}</span>
          </div>
        </div>`;
    }).join('');

    // attach long press to each card
    goals.forEach(g => {
      const el = document.getElementById('gc-' + g.id);
      if (el && !g.locked) attachLongPress(el, g.id);
    });
  }

  function onGoalTap(goalId) {
    const act = S.active();
    if (act) return; // already in a session — do nothing
    const g = S.goalById(goalId);
    if (!g || g.locked) return;
    // punch in
    const session = { goalId: g.id, goalName: g.name, goalColor: g.color||'#6aad7e',
                      punchInAt: Date.now(), breakActive:false, breakStartAt:null, breakUsedSecs:0 };
    S.saveActive(session);
    _fbPushSession();
    renderGoals();
    openSession(g.name, g.color||'#6aad7e');
  }

  // ══════════════════════════════════════════════════════════════════════
  // SESSION SCREEN — driven by S.active()
  // ══════════════════════════════════════════════════════════════════════
  function switchTab(tab, btn) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
    btn.classList.add('active');
  }

  // ── CLOCK SUB-NAV ─────────────────────────────────────────────────────

  // ── WAKE LOCK ─────────────────────────────────────────────────────────
  let _wakeLock = null;

  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return; // not supported — silent fail
    try {
      _wakeLock = await navigator.wakeLock.request('screen');
      _wakeLock.addEventListener('release', () => { _wakeLock = null; });
    } catch (e) {
      // permission denied or tab not visible — ignore
    }
  }

  function releaseWakeLock() {
    if (_wakeLock) { _wakeLock.release(); _wakeLock = null; }
  }

  // re-acquire on tab becoming visible (wake lock releases on tab hide)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && S.active()) requestWakeLock();
  });

  // ── PUNCH LOG ─────────────────────────────────────────────────────────
  function renderLogPane() {
    const pane = document.getElementById('log-pane-inner');
    if (!pane) return;

    const log   = S.log().slice().reverse();
    const goals = S.goals();

    if (!log.length) {
      pane.innerHTML = '<div class="log-empty">no entries yet — complete a session to see your log</div>';
      return;
    }

    // group by date
    const grouped = {};
    log.forEach(e => {
      const key = e.date || S.today();
      if (!grouped[key]) grouped[key] = [];
      grouped[key].push(e);
    });

    const tierColors = {
      'Best Day':          'var(--blue)',
      'Average Day':       'var(--amber)',
      'Minimum Viable Day':'var(--green)',
    };
    const tierLabels = {
      'Best Day':          'BSD',
      'Average Day':       'AV',
      'Minimum Viable Day':'MVD',
    };

    pane.innerHTML = Object.entries(grouped).map(([date, entries]) => {
      const dateObj  = new Date(entries[0].punchIn || Date.now());
      const dateLabel = dateObj.toLocaleDateString('en-CA', { weekday:'short', month:'short', day:'numeric' }).toUpperCase();

      const entriesHtml = entries.map(e => {
        const g      = goals.find(x => String(x.id) === String(e.goalId));
        const color  = g ? g.color : '#555555';
        const name   = e.goalName || (g ? g.name : 'Unknown');
        const dur    = fmtHrMin(e.durationSecs || 0);
        const inTime = e.punchIn  ? new Date(e.punchIn ).toLocaleTimeString('en-CA', { hour:'2-digit', minute:'2-digit', hour12:false }) : '—';
        const outTime= e.punchOut ? new Date(e.punchOut).toLocaleTimeString('en-CA', { hour:'2-digit', minute:'2-digit', hour12:false }) : '?';
        const tier   = e.tierResult;
        const clips  = e.clipsDrawn || [];

        const tierHtml = tier
          ? `<span class="log-tier-pill" style="color:${tierColors[tier]||'var(--text4)'};">${tierLabels[tier]||tier}</span>`
          : '';

        const clipDotsHtml = clips.length
          ? `<div class="log-clip-dots">${clips.map(c=>`<div class="log-clip-dot" style="background:${c.hex};"></div>`).join('')}</div>`
          : '';

        const clipsLabel = clips.length
          ? `<span class="log-clips-badge">+${clips.length} clip${clips.length!==1?'s':''}</span>`
          : '';

        return `
          <div class="log-entry">
            <div class="log-entry-dot" style="background:${color};"></div>
            <div class="log-entry-info">
              <div class="log-entry-name">${name}</div>
              <div class="log-entry-meta">
                <span>${inTime} → ${outTime}</span>
                ${tierHtml}
                ${clipsLabel}
              </div>
            </div>
            <div class="log-entry-right">
              <span class="log-entry-dur">${dur}</span>
              ${clipDotsHtml}
            </div>
          </div>`;
      }).join('');

      return `
        <div class="log-date-group">
          <div class="log-date-label">${dateLabel}</div>
          ${entriesHtml}
        </div>`;
    }).join('');
  }

  let _reorderMode  = false;

  function enterReorderMode() {
    _reorderMode = true;
    document.getElementById('reorder-bar').classList.add('visible');
    const list = document.getElementById('goal-list');
    list.querySelectorAll('.goalcard').forEach(card => {
      card.classList.add('reorder-mode');

    });
    _attachDragListeners();

  function exitReorderMode() {
    _reorderMode = false;
    document.getElementById('reorder-bar').classList.remove('visible');
    // save new order from current DOM order
    const list  = document.getElementById('goal-list');
    const cards = [...list.querySelectorAll('.goalcard[id^="gc-"]')];
    const newOrder = cards.map(c => c.id.replace('gc-', ''));
    const goals = S.goals();
    const reordered = newOrder.map(id => goals.find(g => String(g.id) === String(id))).filter(Boolean);
    // append any goals not in DOM (shouldn't happen but safe)
    goals.forEach(g => { if (!reordered.find(r => String(r.id) === String(g.id))) reordered.push(g); });
    S.saveGoals(reordered);
    _fbPushFullState();
    renderGoals();
  }

  function _attachDragListeners() {
    const list  = document.getElementById('goal-list');
    const cards = [...list.querySelectorAll('.goalcard')];

    cards.forEach(card => {
      // ── HTML5 drag (desktop / Chrome Android) ──────────────────────────
      card.addEventListener('dragstart', e => {
        _dragSrcId = card.id;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        list.querySelectorAll('.goalcard').forEach(c => c.classList.remove('drag-over'));
      });
      card.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        list.querySelectorAll('.goalcard').forEach(c => c.classList.remove('drag-over'));
        card.classList.add('drag-over');
      });
      card.addEventListener('drop', e => {
        e.preventDefault();
        if (_dragSrcId && _dragSrcId !== card.id) {
          const src  = document.getElementById(_dragSrcId);
          const dest = card;
          // insert src before or after dest based on pointer position
          const destRect = dest.getBoundingClientRect();
          const after    = e.clientY > destRect.top + destRect.height / 2;
          list.insertBefore(src, after ? dest.nextSibling : dest);
        }
        list.querySelectorAll('.goalcard').forEach(c => c.classList.remove('drag-over'));
      });

      // ── Touch drag (pointer events fallback) ───────────────────────────
      let _touchDragCard = null;
      let _touchClone    = null;
      let _touchOffsetY  = 0;

      card.addEventListener('pointerdown', e => {
        if (!_reorderMode) return;
        _touchDragCard = card;
        _touchOffsetY  = e.clientY - card.getBoundingClientRect().top;
        // create a visual clone that follows the finger
        _touchClone = card.cloneNode(true);
        _touchClone.style.cssText = `
          position:fixed; left:${card.getBoundingClientRect().left}px;
          width:${card.offsetWidth}px; opacity:0.85; z-index:500;
          pointer-events:none; border-color:var(--amber);
        `;
        document.body.appendChild(_touchClone);
        card.classList.add('dragging');
        card.setPointerCapture(e.pointerId);
      }, { passive: true });

      card.addEventListener('pointermove', e => {
        if (!_touchDragCard || _touchDragCard !== card) return;
        const y = e.clientY;
        if (_touchClone) _touchClone.style.top = (y - _touchOffsetY) + 'px';
        // find card under finger
        _touchClone && (_touchClone.style.display = 'none');
        const el = document.elementFromPoint(e.clientX, y);
        _touchClone && (_touchClone.style.display = '');
        const target = el ? el.closest('.goalcard') : null;
        list.querySelectorAll('.goalcard').forEach(c => c.classList.remove('drag-over'));
        if (target && target !== card) {
          target.classList.add('drag-over');
          const rect  = target.getBoundingClientRect();
          const after = y > rect.top + rect.height / 2;
          list.insertBefore(card, after ? target.nextSibling : target);
        }
      });

      const endTouch = () => {
        if (!_touchDragCard || _touchDragCard !== card) return;
        card.classList.remove('dragging');
        list.querySelectorAll('.goalcard').forEach(c => c.classList.remove('drag-over'));
        if (_touchClone) { _touchClone.remove(); _touchClone = null; }
        _touchDragCard = null;
      };
      card.addEventListener('pointerup',    endTouch);
      card.addEventListener('pointercancel',endTouch);
    });
  }

  function updateSessionUI() {
    const act = S.active(); if (!act) return;

    const g         = S.goalById(act.goalId);

    if (barFill && g) {
      const todayKey  = S.today();
      const todaySecs = ((g.dailySecs && g.dailySecs[todayKey]) || 0) + focusSecs;
      const hasTiers  = g.mvdVal && g.bsdVal;
      const pct       = hasTiers ? Math.min(100, (todaySecs / g.bsdVal) * 100) : Math.min(100, todaySecs / 3600 * 33);
      barFill.style.width = pct + '%';

    document.getElementById('session-focus-btn').style.display = onBreak ? '' : 'none';
    document.getElementById('session-break-btn').style.display = onBreak ? 'none' : '';
    const infoEl = document.getElementById('session-break-info');

    if (onBreak) {
      const allowedSecs = Math.floor(focusSecs / 4);

      if (remaining >= 0) {

  function onPunchOut() {
    clearInterval(_sessionInterval);
    const act = S.active(); if (!act) return;
    const now       = Date.now();
    const focusSecs = S.focusElapsedSecs(act);
    const goals     = S.goals();
    const g         = goals.find(go => String(go.id) === String(act.goalId));

    let drawnClips = [];
    let tierResult = null;

    if (g) {
      // credit daily secs
      const todayKey        = S.today();
      g.dailySecs           = g.dailySecs || {};
      g.dailySecs[todayKey] = (g.dailySecs[todayKey] || 0) + focusSecs;
      g.totalSecs           = (g.totalSecs || 0) + focusSecs;

      // compute tier from today's total
      const todaySecs = g.dailySecs[todayKey];
      if (g.mvdVal && g.bsdVal) {
        if      (todaySecs >= g.bsdVal) tierResult = { tier:'Best Day',          clips: g.bsdClips || 3 };
        else if (todaySecs >= g.avVal)  tierResult = { tier:'Average Day',        clips: g.avClips  || 2 };
        else if (todaySecs >= g.mvdVal) tierResult = { tier:'Minimum Viable Day', clips: g.mvdClips || 1 };
      }

      // only award clips if newly reached a higher tier than today's previous best
      const tierOrder = { 'Minimum Viable Day':1, 'Average Day':2, 'Best Day':3 };
      const logs      = S.log();
      const todayLogs = logs.filter(e => String(e.goalId) === String(act.goalId) && e.date === todayKey);
      const prevTier  = todayLogs.length > 0 ? todayLogs[todayLogs.length-1].tierResult : null;
      const prevRank  = tierOrder[prevTier] || 0;
      const newRank   = tierOrder[tierResult ? tierResult.tier : null] || 0;

      if (tierResult && newRank > prevRank) {
        drawnClips = S.drawClips(tierResult.clips);
        S.addToHolding(act.goalId, drawnClips);
      }

      // save log entry
      logs.push({
        id:          now,
        goalId:      act.goalId,
        goalName:    g.name,
        date:        todayKey,
        punchIn:     act.punchInAt,
        punchOut:    now,
        durationSecs: focusSecs,
        tierResult:  tierResult ? tierResult.tier : null,
        clipsEarned: drawnClips.length,
        clipsDrawn:  drawnClips,
      });
      S.saveLog(logs);

      // pato system
      S.ensurePatoFields(g);
      S.syncPatoStreak(g);
      S.tryEarnPato(g, todaySecs);
      S.saveGoals(goals);
    }

    S.saveActive(null);
    releaseWakeLock();
    _fbPushSession();
    _fbPushFullState();
    document.getElementById('session-screen').classList.remove('open');
    renderGoals();
  }

  const WHEEL_SEGMENTS = [
    { id:'t1',      label:'Tier 1',  pct:40, color:'#6aad7e' },
    { id:'t2',      label:'Tier 2',  pct:30, color:'#7a9ade' },

  function generateRingRouletteSlices(counts, seed) {
    const slots = [];
    for (const id in counts) for (let i = 0; i < counts[id]; i++) slots.push(id);
    let s = seed >>> 0;
    function rand() {
      s = (s + 0x6D2B79F5) >>> 0; let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    for (let i = slots.length - 1; i > 0; i--) { const j = Math.floor(rand()*(i+1)); [slots[i],slots[j]]=[slots[j],slots[i]]; }
    const n = slots.length;
    const adj = (i,off) => slots[(i+off+n)%n];
    const isConflict = i => slots[i]===adj(i,-1)||slots[i]===adj(i,1);
    const wouldFit = (id,j) => id!==adj(j,-1)&&id!==adj(j,1);
    for (let pass=0;pass<4;pass++) {
      let any=false;
      for (let i=0;i<n;i++) {
        if (!isConflict(i)) continue;
        for (let k=0;k<n;k++) { const j=(i+k)%n; if(j===i) continue; if(wouldFit(slots[j],i)&&wouldFit(slots[i],j)){[slots[i],slots[j]]=[slots[j],slots[i]];any=true;break;} }
      }
      if (!any) break;
    }
    return slots;
  }

  const MAIN_WHEEL_SLICES  = generateRingRouletteSlices({ t1:14,t2:11,t3:7,bonus:3,jackpot:1 }, 0xF10E10D);
  const BONUS_WHEEL_SLICES = generateRingRouletteSlices({ p75:14,p50:11,p25:5,extra:4,free:2 }, 0xB05E51);

  function buildRingRouletteSVG(opts) {
    const { size,cx,cy,outerR,innerR,slices,labelColors,dividerColors,dividerOpacity,labels,fontSizes,filterPrefix,nativeSize } = opts;
    const vb = nativeSize || size;
    const n = slices.length; const slicePct = 360/n; const labelR = (outerR+innerR)/2;
    function pt(deg,r){const rad=(deg-90)*Math.PI/180;return[cx+r*Math.cos(rad),cy+r*Math.sin(rad)];}
    function f(v){return typeof v==='number'?+v.toFixed(3):v;}
    function annularPath(sDeg,eDeg,oR,iR){
      const span=eDeg-sDeg; const large=span>180?1:0;
      const[ox1,oy1]=pt(sDeg,oR);const[ox2,oy2]=pt(eDeg,oR);
      const[ix1,iy1]=pt(sDeg,iR);const[ix2,iy2]=pt(eDeg,iR);
      return `M${f(ix1)},${f(iy1)} L${f(ox1)},${f(oy1)} A${oR},${oR} 0 ${large},1 ${f(ox2)},${f(oy2)} L${f(ix2)},${f(iy2)} A${iR},${iR} 0 ${large},0 ${f(ix1)},${f(iy1)}Z`;
    }
    const gdivId=filterPrefix+'-gdiv'; const glabId=filterPrefix+'-glab';
    let s=`<svg width="${size}" height="${size}" viewBox="0 0 ${vb} ${vb}" xmlns="http://www.w3.org/2000/svg">`;
    s+=`<defs><filter id="${gdivId}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
    s+=`<filter id="${glabId}" x="-40%" y="-200%" width="180%" height="500%"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="${f(outerR+5)}" fill="#2e2e2c"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="${f(outerR+3)}" fill="#1c1c1a"/>`;
    for(let i=0;i<n;i++){const sd=i*slicePct;const ed=sd+slicePct;const shade=i%2===0?'#141414':'#1c1c1a';s+=`<path d="${annularPath(sd,ed,outerR,innerR)}" fill="${shade}"/>`;}
    for(let i=0;i<n;i++){const id=slices[i];const deg=i*slicePct;const[ox,oy]=pt(deg,outerR);const[ix,iy]=pt(deg,innerR);const rgb=dividerColors[id];const op=dividerOpacity[id]!=null?dividerOpacity[id]:0.5;s+=`<line x1="${f(ix)}" y1="${f(iy)}" x2="${f(ox)}" y2="${f(oy)}" stroke="rgba(${rgb},${op})" stroke-width="0.7" filter="url(#${gdivId})"/>`;}
    s+=`<circle cx="${cx}" cy="${cy}" r="${f(outerR+0.5)}" fill="none" stroke="#555" stroke-width="2"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="${f(innerR)}" fill="none" stroke="#333" stroke-width="1.5"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="${f(innerR-1)}" fill="#0c0c0b"/>`;
    for(let i=0;i<n;i++){const id=slices[i];const angle=i*slicePct-90+slicePct/2;s+=`<text transform="translate(${cx},${cy}) rotate(${f(angle)}) translate(${f(labelR)},0)" text-anchor="middle" dominant-baseline="middle" fill="${labelColors[id]}" font-family="Syne,sans-serif" font-size="${fontSizes[id]||7}" font-weight="700" filter="url(#${glabId})">${labels[id]}</text>`;}
    s+=`<circle cx="${cx}" cy="${cy}" r="${f(innerR*0.322)}" fill="#1e1e1c"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="${f(innerR*0.294)}" fill="#0e0e0d" stroke="#3a3a38" stroke-width="1"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="3" fill="#555"/>`;
    s+=`</svg>`;
    return s;
  }

  let wheelSpinning   = false;

  let _selectedClipIndices = new Set();

  function renderWheelPane() {
    const pane = document.getElementById('wheel-pane-inner');
    if (!pane) return;

    // pick first normal goal as the wheel goal for now
    const goals = S.goals().filter(g => g.kind !== 'blocker');
    if (!_wheelGoalId && goals.length) _wheelGoalId = goals[0].id;
    const wState = _wheelGoalId ? S.wheel(_wheelGoalId) : { holding:[] };
    const holding = wState.holding || [];

    const availW = pane.clientWidth || 320;
    const wheelSize = Math.max(260, Math.min(460, availW - 32));

    const hasClips  = holding.length > 0;
    const selCount  = _selectedClipIndices.size;
    const ceiling   = computeWheelCeiling(holding);
    const ceilLabel = ceiling===3?'Tier 3':ceiling===2?'Tier 2':'Tier 1';
    const ceilColor = ceiling===3?'var(--amber)':ceiling===2?'var(--blue)':'var(--green)';
    const ceilExplain = selCount===0
      ? 'select clips below to raise your ceiling'
      : ceiling===3?'3 matching or gold — Tier 3 ceiling unlocked'
      : ceiling===2?'2 matching — Tier 2 ceiling unlocked'
      : 'select 2+ matching clips to raise ceiling';

    const canSpin = hasClips && selCount > 0 && !wheelSpinning;
    const spinLabel = !hasClips?'earn clips to spin':selCount===0?'select clips to set ceiling':wheelSpinning?'spinning…':'spin · ceiling '+ceilLabel;

    pane.innerHTML = `
      <div class="wheel-wrap" style="width:${wheelSize}px;height:${wheelSize}px;">
        <div class="wheel-disc" id="wheel-disc" style="transform:rotate(${wheelRotation}deg);">
          ${buildWheelSVG(wheelSize)}
        </div>
        <div class="wheel-pointer">
          <svg width="${wheelSize}" height="${wheelSize}" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
            <polygon points="130,8 124,0 136,0" fill="#d4d4d2" opacity="0.92"/>
          </svg>
        </div>
      </div>

      <div class="wheel-legend">
        ${WHEEL_SEGMENTS.map(s=>`<div class="wheel-legend-item"><div class="wheel-legend-dot" style="background:${s.color};"></div>${s.label}</div>`).join('')}
      </div>

      <button class="spin-btn" onclick="onSpin()" ${canSpin?'':'disabled'}>${spinLabel}</button>

      <div class="holding-section">
        <div class="holding-label">holding area · tap to select</div>
        <div class="holding-grid" id="holding-grid">
          ${hasClips
            ? holding.map((c,i)=>`<div class="clip-dot${_selectedClipIndices.has(i)?' selected':''}" style="background:${c.hex};box-shadow:${_selectedClipIndices.has(i)?'0 0 8px '+c.hex:'none'};" onclick="toggleClip(${i})">${_selectedClipIndices.has(i)?'✓':''}</div>`).join('')
